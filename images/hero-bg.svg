    <circle cx="990" cy="140" r="1.2"/>
    <circle cx="1120" cy="80" r="1.6"/>
    <circle cx="1200" cy="150" r="1.1"/>
    <circle cx="150" cy="620" r="1.3"/>
    <circle cx="1100" cy="630" r="1.4"/>
    <circle cx="60" cy="400" r="1.2"/>
    <circle cx="1220" cy="420" r="1.3"/>
    <circle cx="640" cy="680" r="1.1"/>
