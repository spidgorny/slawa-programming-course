<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="560">
  <style>
    .lbl { font-family: Arial, sans-serif; font-size: 18px; fill: #1a202c; }
    .gate { fill: #cbd5e0; stroke: #1a202c; stroke-width: 2; }
    .wire { stroke: #1a202c; stroke-width: 2; fill: none; }
  </style>

  <!-- AND gate -->
  <g transform="translate(20,20)">
    <path class="gate" d="M0,0 L60,0 A50,50 0 0 1 60,100 L0,100 Z"/>
    <line class="wire" x1="-30" y1="25" x2="0" y2="25"/>
    <line class="wire" x1="-30" y1="75" x2="0" y2="75"/>
    <line class="wire" x1="110" y1="50" x2="140" y2="50"/>
    <text class="lbl" x="55" y="140" text-anchor="middle">AND</text>
  </g>

  <!-- OR gate -->
  <g transform="translate(230,20)">
    <path class="gate" d="M0,0 Q40,0 70,50 Q40,100 0,100 Q25,50 0,0 Z"/>
    <line class="wire" x1="-30" y1="25" x2="5" y2="25"/>
    <line class="wire" x1="-30" y1="75" x2="5" y2="75"/>
    <line class="wire" x1="70" y1="50" x2="100" y2="50"/>
    <text class="lbl" x="35" y="140" text-anchor="middle">OR</text>
  </g>

  <!-- NOT gate -->
  <g transform="translate(430,20)">
    <path class="gate" d="M0,0 L60,50 L0,100 Z"/>
    <circle class="gate" cx="68" cy="50" r="8"/>
    <line class="wire" x1="-30" y1="50" x2="0" y2="50"/>
    <line class="wire" x1="76" y1="50" x2="106" y2="50"/>
    <text class="lbl" x="35" y="140" text-anchor="middle">NOT</text>
  </g>
</svg>
