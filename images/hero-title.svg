<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="55%" stop-color="#151a3d"/>
      <stop offset="100%" stop-color="#241a4a"/>
    </linearGradient>
    <radialGradient id="glowCenter" cx="50%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#2b3a7a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0a0e27" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pathGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4fd1c5"/>
      <stop offset="35%" stop-color="#63b3ed"/>
      <stop offset="65%" stop-color="#9f7aea"/>
      <stop offset="100%" stop-color="#f687b3"/>
    </linearGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base background -->
  <rect x="0" y="0" width="1280" height="720" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1280" height="720" fill="url(#glowCenter)"/>

  <!-- Scattered stars / particles for depth -->
  <g fill="#ffffff" opacity="0.35">
    <circle cx="90" cy="90" r="1.6"/>
    <circle cx="220" cy="150" r="1.2"/>
    <circle cx="340" cy="70" r="1.8"/>
    <circle cx="460" cy="130" r="1.1"/>
    <circle cx="610" cy="60" r="1.5"/>
    <circle cx="760" cy="110" r="1.3"/>
    <circle cx="880" cy="60" r="1.7"/>
    <circle cx="990" cy="140" r="1.2"/>
    <circle cx="1120" cy="80" r="1.6"/>
    <circle cx="1200" cy="150" r="1.1"/>
    <circle cx="150" cy="620" r="1.3"/>
    <circle cx="1100" cy="630" r="1.4"/>
  </g>

  <!-- Journey path strip along the bottom third -->
  <g filter="url(#softGlow)">
    <path d="M 70 640 C 260 560, 420 600, 560 560 S 820 520, 980 560 S 1180 600, 1210 560"
          fill="none" stroke="url(#pathGrad)" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
  </g>

  <!-- 1. Electron / atom (far left) -->
  <g transform="translate(70,610)">
    <circle r="14" fill="none" stroke="#4fd1c5" stroke-width="2" opacity="0.9"/>
    <ellipse rx="26" ry="10" fill="none" stroke="#4fd1c5" stroke-width="1.5" opacity="0.8"/>
    <ellipse rx="26" ry="10" fill="none" stroke="#4fd1c5" stroke-width="1.5" opacity="0.8" transform="rotate(60)"/>
    <ellipse rx="26" ry="10" fill="none" stroke="#4fd1c5" stroke-width="1.5" opacity="0.8" transform="rotate(120)"/>
    <circle cx="26" cy="0" r="3" fill="#4fd1c5"/>
  </g>

  <!-- 2. Binary digits -->
  <g font-family="Menlo, Consolas, monospace" font-size="22" fill="#90cdf4" opacity="0.95">
    <text x="300" y="585">01</text>
    <text x="300" y="615">10</text>
  </g>

  <!-- 3. Logic gate (AND-ish shape) -->
  <g transform="translate(520,560)" stroke="#9f9cf5" stroke-width="2.5" fill="none" opacity="0.95">
    <path d="M -22 -20 L 0 -20 A 20 20 0 0 1 0 20 L -22 20 Z"/>
    <line x1="-34" y1="-10" x2="-22" y2="-10"/>
    <line x1="-34" y1="10" x2="-22" y2="10"/>
    <line x1="20" y1="0" x2="34" y2="0"/>
  </g>

  <!-- 4. CPU chip -->
  <g transform="translate(700,555)" stroke="#b794f4" stroke-width="2.5" fill="none" opacity="0.95">
    <rect x="-22" y="-22" width="44" height="44" rx="4"/>
    <rect x="-10" y="-10" width="20" height="20" rx="2"/>
    <line x1="-22" y1="-12" x2="-30" y2="-12"/>
    <line x1="-22" y1="0"   x2="-30" y2="0"/>
    <line x1="-22" y1="12"  x2="-30" y2="12"/>
    <line x1="22"  y1="-12" x2="30"  y2="-12"/>
    <line x1="22"  y1="0"   x2="30"  y2="0"/>
    <line x1="22"  y1="12"  x2="30"  y2="12"/>
    <line x1="-12" y1="-22" x2="-12" y2="-30"/>
    <line x1="12"  y1="-22" x2="12"  y2="-30"/>
    <line x1="-12" y1="22"  x2="-12" y2="30"/>
    <line x1="12"  y1="22"  x2="12"  y2="30"/>
  </g>

  <!-- 5. Code brackets -->
  <g font-family="Menlo, Consolas, monospace" font-size="34" fill="#d6a8f0" opacity="0.95">
    <text x="860" y="570" text-anchor="middle">&lt;/&gt;</text>
  </g>

  <!-- 6. App grid icon -->
  <g transform="translate(1010,545)" fill="#f0a8c7" opacity="0.95">
    <rect x="-24" y="-24" width="18" height="18" rx="4"/>
    <rect x="6"   y="-24" width="18" height="18" rx="4"/>
    <rect x="-24" y="6"   width="18" height="18" rx="4"/>
    <rect x="6"   y="6"   width="18" height="18" rx="4"/>
  </g>

  <!-- 7. Cloud shape (far right, nod to the cloud bonus section) -->
  <g transform="translate(1170,560)" fill="none" stroke="#f687b3" stroke-width="2.5" opacity="0.95">
    <path d="M -34 10 a14 14 0 0 1 2 -27 a18 18 0 0 1 34 -4 a14 14 0 0 1 10 26 Z"/>
  </g>
</svg>
