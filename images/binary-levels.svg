<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" width="620">
  <style>
    .t { font-family: Arial, sans-serif; fill: #e2e8f0; }
    .h { font-size: 24px; font-weight: bold; }
    .s { font-size: 18px; }
    .lvl { stroke: rgba(226,232,240,0.35); stroke-width: 1; stroke-dasharray: 4 4; }
  </style>

  <!-- Left panel: 2 levels -->
  <rect x="10" y="10" width="290" height="420" rx="14" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.25)"/>
  <text class="t h" x="155" y="45" text-anchor="middle">2 levels</text>
  <rect x="30" y="80" width="250" height="40" fill="rgba(104,211,145,0.25)"/>
  <rect x="30" y="280" width="250" height="40" fill="rgba(104,211,145,0.25)"/>
  <text class="t s" x="38" y="106">1</text>
  <text class="t s" x="38" y="306">0</text>
  <polyline fill="none" stroke="#68d391" stroke-width="3"
    points="55,302 75,296 85,305 95,298 100,100 115,95 130,104 145,97 160,103 165,300 180,295 195,306 210,299 215,98 230,104 245,96 260,102 275,97"/>
  <text class="t s" x="155" y="370" text-anchor="middle">Big gap between states —</text>
  <text class="t s" x="155" y="395" text-anchor="middle">noise can't fool it ✓</text>

  <!-- Right panel: 10 levels -->
  <rect x="320" y="10" width="290" height="420" rx="14" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.25)"/>
  <text class="t h" x="465" y="45" text-anchor="middle">10 levels</text>
  <line class="lvl" x1="340" y1="80"  x2="590" y2="80"/>
  <line class="lvl" x1="340" y1="107" x2="590" y2="107"/>
  <line class="lvl" x1="340" y1="134" x2="590" y2="134"/>
  <line class="lvl" x1="340" y1="161" x2="590" y2="161"/>
  <line class="lvl" x1="340" y1="188" x2="590" y2="188"/>
  <line class="lvl" x1="340" y1="215" x2="590" y2="215"/>
  <line class="lvl" x1="340" y1="242" x2="590" y2="242"/>
  <line class="lvl" x1="340" y1="269" x2="590" y2="269"/>
  <line class="lvl" x1="340" y1="296" x2="590" y2="296"/>
  <line class="lvl" x1="340" y1="323" x2="590" y2="323"/>
  <polyline fill="none" stroke="#fc8181" stroke-width="3"
    points="345,250 360,232 372,262 385,201 398,226 410,178 423,210 436,150 449,187 462,232 475,205 488,268 501,240 514,170 527,199 540,128 553,160 566,214 580,190"/>
  <text class="t s" x="465" y="370" text-anchor="middle">States sit close together —</text>
  <text class="t s" x="465" y="395" text-anchor="middle">noise blurs them ✗</text>
</svg>
