<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 520" width="460">
  <style>
    .t { font-family: Arial, sans-serif; fill: #1a202c; font-size: 22px; font-weight: bold; }
    .c { font-family: Arial, sans-serif; fill: #1a202c; font-size: 64px; font-weight: bold; }
    .box { stroke: #1a202c; stroke-width: 1.5; }
  </style>
  <circle class="box" cx="230" cy="260" r="62" fill="#90cdf4"/>
  <text class="c" x="230" y="282" text-anchor="middle">C</text>

  <g stroke="rgba(226,232,240,0.5)" stroke-width="2">
    <line x1="230" y1="198" x2="230" y2="110"/>
    <line x1="230" y1="322" x2="230" y2="410"/>
    <line x1="175" y1="230" x2="120" y2="185"/>
    <line x1="285" y1="230" x2="340" y2="185"/>
    <line x1="175" y1="290" x2="120" y2="335"/>
    <line x1="285" y1="290" x2="340" y2="335"/>
  </g>

  <rect class="box" x="140" y="40"  width="180" height="70" rx="12" fill="#f2b880"/>
  <text class="t" x="230" y="83" text-anchor="middle">OS kernels</text>
  <rect class="box" x="10"  y="140" width="180" height="70" rx="12" fill="#e9e08a"/>
  <text class="t" x="100" y="183" text-anchor="middle">Cars</text>
  <rect class="box" x="270" y="140" width="180" height="70" rx="12" fill="#c3e6a0"/>
  <text class="t" x="360" y="183" text-anchor="middle">Routers</text>
  <rect class="box" x="10"  y="310" width="180" height="70" rx="12" fill="#9bdcb0"/>
  <text class="t" x="100" y="353" text-anchor="middle">Microwaves</text>
  <rect class="box" x="270" y="310" width="180" height="70" rx="12" fill="#81d4e0"/>
  <text class="t" x="360" y="353" text-anchor="middle">Databases</text>
  <rect class="box" x="140" y="410" width="180" height="70" rx="12" fill="#63b3ed"/>
  <text class="t" x="230" y="453" text-anchor="middle">Game engines</text>
</svg>
